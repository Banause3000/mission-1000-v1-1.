name: Test kostenlose Formquelle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-free-form-source:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python vorbereiten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Downloadseite pruefen und CSV-Links suchen
        shell: bash
        run: |
          set -euo pipefail

          PAGE="https://tennisdata.app/downloads/"
          curl -L --fail --retry 2 \
            -A "Mozilla/5.0 Mission1000/0.8.1" \
            "$PAGE" -o /tmp/downloads.html

          python - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          html = Path("/tmp/downloads.html").read_text(errors="ignore")
          base = "https://tennisdata.app/downloads/"

          hrefs = re.findall(
              r'href=["\']([^"\']+\.csv(?:\?[^"\']*)?)["\']',
              html,
              flags=re.I
          )

          urls = [urljoin(base, href) for href in hrefs]

          atp = next(
              (url for url in urls if "2026-atp-season.csv" in url.lower()),
              None
          )

          wta = next(
              (url for url in urls if "2026-wta-season.csv" in url.lower()),
              None
          )

          if not atp or not wta:
              print(
                  "Die oeffentliche Seite liefert dem GitHub-Runner "
                  "keine direkten CSV-Links."
              )
              raise SystemExit(20)

          Path("/tmp/atp_url").write_text(atp)
          Path("/tmp/wta_url").write_text(wta)

          print("CSV-Links gefunden.")
          PY

      - name: ATP und WTA CSV herunterladen
        shell: bash
        run: |
          set -euo pipefail

          ATP_URL="$(cat /tmp/atp_url)"
          WTA_URL="$(cat /tmp/wta_url)"

          curl -L --fail --retry 2 \
            -A "Mozilla/5.0 Mission1000/0.8.1" \
            "$ATP_URL" -o /tmp/atp.csv

          curl -L --fail --retry 2 \
            -A "Mozilla/5.0 Mission1000/0.8.1" \
            "$WTA_URL" -o /tmp/wta.csv

          test -s /tmp/atp.csv
          test -s /tmp/wta.csv

          echo "ATP CSV: $(wc -c </tmp/atp.csv) Bytes"
          echo "WTA CSV: $(wc -c </tmp/wta.csv) Bytes"

      - name: Formdaten erzeugen
        run: |
          python scripts/build_form_from_csv.py /tmp/atp.csv /tmp/wta.csv

      - name: Aenderungen committen
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- data/form.json; then
            echo "Keine Aenderungen."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/form.json
          git commit -m "Update tennis form data"
          git push
