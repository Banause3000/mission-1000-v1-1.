name: Formdaten aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * *"

permissions:
  contents: write

jobs:
  update-form:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python vorbereiten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ATP 2026 laden
        run: |
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/JeffSackmann/tennis_atp/master/atp_matches_2026.csv" \
            -o /tmp/atp_matches_2026.csv

      - name: WTA 2026 laden
        run: |
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/JeffSackmann/tennis_wta/master/wta_matches_2026.csv" \
            -o /tmp/wta_matches_2026.csv

      - name: Formdaten erzeugen
        run: |
          python scripts/build_form_sackmann.py \
            /tmp/atp_matches_2026.csv \
            /tmp/wta_matches_2026.csv

      - name: Änderungen committen
        shell: bash
        run: |
          set -e

          if git diff --quiet -- data/form.json; then
            echo "Keine Änderungen."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/form.json
          git commit -m "Update form data"
          git push
